name: release

# Every push to main runs the dry run: the package checked as it would be
# published, with read access only and no secret. A tag vX.Y.Z on main runs
# the dry run on the tag and then, once a person approves it, the publish
# job, which creates the GitHub release. Nothing is uploaded to Packagist:
# it reads each tag through its GitHub hook, and installs download the
# archive GitHub builds from the tag, with the export-ignore rules of
# .gitattributes applied.
#
# What this workflow needs, set up by the repository's owners:
# - Environment "release" with required reviewers (a person approves every
#   publish run before it starts) and a deployment rule that allows only v*
#   tags. It holds no secret.
# - Secrets: none. The publish job uses the workflow's own GITHUB_TOKEN with
#   contents: write on this repository, and writes to no other repository.
# - Packagist: the package bynn/decisionnode submitted from this repository,
#   with the Packagist GitHub hook on it.
#
# Before tagging, the CHANGELOG's top entry carries the version and its
# release date ("## [0.3.0] - 2026-10-20"), and DecisionNode::VERSION the
# same version.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      # --no-check-all: the session socket is built on phrity/websocket
      # 3.8.1's classes, so that one requirement is pinned to an exact
      # version on purpose. Every other check stays strict.
      - name: Validate composer.json
        run: composer validate --strict --no-check-all
      - name: Check the version
        shell: bash
        run: |
          top="$(grep -m1 -E '^## \[' CHANGELOG.md)"
          version="$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?)\].*/\1/p' <<<"$top")"
          if [ -z "$version" ]; then
            echo "::error::the CHANGELOG's top entry is not a version: $top"
            exit 1
          fi
          code="$(sed -nE "s/^ *public const VERSION = '([^']+)';$/\1/p" src/DecisionNode.php)"
          if [ "$code" != "$version" ]; then
            echo "::error::DecisionNode::VERSION is '$code', the CHANGELOG's top entry $version"
            exit 1
          fi
          if grep -q '"version"' composer.json; then
            echo "::error::composer.json must not name a version: Packagist takes it from the tag"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::the tag $GITHUB_REF_NAME does not match the CHANGELOG's top entry $version"
              exit 1
            fi
            if ! grep -qE '^## \[[^]]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' <<<"$top"; then
              echo "::error::the CHANGELOG entry for $version has no release date: $top"
              exit 1
            fi
          fi
          echo "version $version"
      # Two archives are checked: Composer's own, and the one GitHub builds
      # from the tag, which is what an install downloads. Both apply the
      # export-ignore rules, and both may hold only the files below.
      - name: Check the package's files
        shell: bash
        run: |
          allowed='^(composer\.json|README\.md|LICENSE|CHANGELOG\.md|src/([A-Za-z0-9_]+/)*|src/([A-Za-z0-9_]+/)*[A-Za-z0-9_]+\.php)$'
          out="$RUNNER_TEMP/package"
          mkdir -p "$out/composer" "$out/git"
          composer archive --format=zip --dir="$out" --file=package
          unzip -Z1 "$out/package.zip" | sort > "$out/composer.txt"
          git archive --format=tar HEAD | tar -t | sort > "$out/git.txt"
          status=0
          for list in composer git; do
            echo "$list archive: $(grep -cv '/$' "$out/$list.txt") files"
            if bad="$(grep -vE "$allowed" "$out/$list.txt")"; then
              while IFS= read -r path; do
                echo "::error::the $list archive holds $path, which is not part of the package"
              done <<<"$bad"
              status=1
            fi
            for needed in composer.json README.md LICENSE src/DecisionNode.php; do
              if ! grep -qx "$needed" "$out/$list.txt"; then
                echo "::error::the $list archive lacks $needed"
                status=1
              fi
            done
          done
          unzip -q "$out/package.zip" -d "$out/composer"
          (cd "$out/composer" && find . -type f -print0 | xargs -0 python3 "$GITHUB_WORKSPACE/.github/scripts/check-published.py" --readme ./README.md) || status=1
          exit "$status"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dry-run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Only a commit already on main is released: a tag pushed on any other
      # branch stops here.
      - name: Check that the tag is on main
        shell: bash
        run: |
          tagged="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main was not fetched; cannot check the tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tagged" refs/remotes/origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at $tagged, which is not on main"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} ($tagged) is on main"
      - name: Release notes from the CHANGELOG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::the CHANGELOG has no section for $version"
            exit 1
          fi
          python3 .github/scripts/check-published.py "$RUNNER_TEMP/notes.md"
      # Packagist picks the tag up through its GitHub hook; nothing is
      # uploaded from here.
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
